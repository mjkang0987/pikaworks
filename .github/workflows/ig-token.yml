name: 인스타그램 토큰 갱신

# 장기 토큰은 60일이고, 발급 24시간 후 ~ 만료 전 구간에서만 갱신할 수 있다.
# 한 번 만료되면 갱신이 불가능하고 OAuth 를 처음부터 다시 타야 하므로
# 매일 돌려서 여유를 크게 둔다. 갱신할 때마다 만료가 다시 60일로 밀린다.
on:
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 갱신
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request, urllib.error

          TOKEN = os.environ.get('IG_ACCESS_TOKEN', '')
          PAT   = os.environ.get('GH_TOKEN', '')
          HOOK  = os.environ.get('SLACK_WEBHOOK_URL', '')

          def notify(text, level='info'):
              icon = {'info': 'ℹ️', 'warn': '⚠️', 'error': '🚨'}[level]
              line = f'{icon} {text}'
              print(line, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(line + '\n')
              if not HOOK:
                  return
              body = json.dumps({'text': f'{icon} *[pikaworks SNS]* {text}'}).encode()
              req = urllib.request.Request(
                  HOOK, data=body, headers={'Content-Type': 'application/json'}, method='POST')
              try:
                  urllib.request.urlopen(req, timeout=20).read()
              except Exception:
                  pass

          if not TOKEN:
              notify('IG_ACCESS_TOKEN 이 비어 있어 갱신을 건너뜁니다.', 'error')
              raise SystemExit(1)

          if not PAT:
              # 갱신은 새 토큰을 돌려준다. 저장할 수 없으면 호출해봐야 버려지므로
              # 아예 호출하지 않고 사람에게 넘긴다.
              notify('GH_PAT_SECRETS 가 없어 토큰을 자동 저장할 수 없습니다. '
                     'Secrets: write 권한의 fine-grained PAT 를 GH_PAT_SECRETS 로 등록하거나, '
                     'IG_ACCESS_TOKEN 을 수동으로 갱신하세요. '
                     '토큰이 만료되면 OAuth 를 처음부터 다시 타야 합니다.', 'warn')
              raise SystemExit(0)

          params = urllib.parse.urlencode(
              {'grant_type': 'ig_refresh_token', 'access_token': TOKEN})
          try:
              with urllib.request.urlopen(
                      f'https://graph.instagram.com/refresh_access_token?{params}',
                      timeout=60) as r:
                  data = json.loads(r.read())
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', 'replace').replace(TOKEN, '[TOKEN]')
              notify(f'토큰 갱신 실패 (HTTP {e.code}) — {body[:300]}', 'error')
              raise SystemExit(1)

          new_token = data.get('access_token', '')
          # 새 토큰은 아직 secret 이 아니라 러너가 자동으로 가려주지 않는다.
          # 마스크로 등록해 두면 이후 어떤 경로로 출력되든 *** 로 대체된다.
          if new_token:
              print(f'::add-mask::{new_token}', flush=True)

          days = int(data.get('expires_in', 0)) // 86400
          if not new_token:
              notify('갱신 응답에 access_token 이 없습니다.', 'error')
              raise SystemExit(1)

          # 토큰은 stdin 으로만 넘긴다. --body 로 넘기면 명령줄에 들어가고,
          # gh 가 실패했을 때 파이썬이 argv 전체를 예외 메시지로 찍으면서
          # 공개 리포의 Actions 로그에 평문으로 남는다. 실제로 한 번 그렇게 샜다.
          # check=True 를 쓰지 않는 이유도 같다 — CalledProcessError 가 argv 를 담는다.
          proc = subprocess.run(
              ['gh', 'secret', 'set', 'IG_ACCESS_TOKEN',
               '--repo', os.environ['REPO'], '--body-file', '-'],
              input=new_token, text=True,
              stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if proc.returncode != 0:
              err = (proc.stderr or '').replace(new_token, '[TOKEN]').replace(TOKEN, '[TOKEN]')
              notify(f'갱신된 토큰을 저장하지 못했습니다 — {err.strip()[:300]}\n'
                     'GH_PAT_SECRETS 에 이 저장소의 "Secrets: Read and write" 권한이 있는지 '
                     '확인하세요. 기존 토큰은 그대로 유효하므로 발행은 계속됩니다.', 'error')
              raise SystemExit(1)

          notify(f'토큰 갱신 완료 — 만료까지 {days}일')
          PY
