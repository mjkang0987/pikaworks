name: 인스타그램 자동 게시

# 월·금 = ClipNote / 화·목 = TakeASeat
# 실제로 무엇을 올릴지는 이 크론이 아니라 상태 파일의 scheduled_at 이 정한다.
#
# 크론을 두 번 건다. GitHub Actions 크론은 보장이 아니라 최선 노력이고,
# 정각(:00)은 전 세계가 몰려 가장 많이 밀리는 슬롯이다. 실제로 2026-08-27
# 08:00 KST 실행이 통째로 씹혀 takeaseat-1 이 안 나갔다. 실패가 아니라
# 아무 일도 안 일어나서 알림만 봐서는 정상으로 보였다.
#
# publish.py 는 published_at·media_id 로 멱등하므로 같은 날 두 번 돌아도
# 중복 발행되지 않는다. 첫 실행이 올렸으면 두 번째는 조용히 끝난다.
#
#   07:37 KST = 22:37 UTC 전날 (정시)     — 목표 08:00 에서 23분 당겼다
#   10:47 KST = 01:47 UTC 당일 (따라잡기 1)
#   14:47 KST = 05:47 UTC 당일 (따라잡기 2)
#   19:47 KST = 10:47 UTC 당일 (따라잡기 3)
#
# 따라잡기를 세 번 건다. 2026-08-27 에는 정시와 따라잡기가 둘 다 안 돌아
# takeaseat-1 이 그날 못 나갔다. 한 번 더가 아니라 하루를 넓게 덮어야 한다.
# 전부 :47 에 걸어 정각 혼잡을 피한다.
#
# 당기는 이유. 크론은 밀리기만 하지 당겨지지 않는다. 08:00 에 걸면 실제
# 발행은 08:00~08:30 어딘가가 되고, 관측된 지연은 13분이었다. 목표 시각에서
# 미리 빼두면 밀려도 08:00 근처에 떨어지고, 안 밀리면 조금 이르게 나갈 뿐이다.
# 늦는 쪽이 이르는 쪽보다 나쁘다.
on:
  schedule:
    - cron: '37 22 * * 0,1,3,4'   # 월·화·목·금 07:37 KST  정시
    - cron: '47 1 * * 1,2,4,5'    # 월·화·목·금 10:47 KST  따라잡기
    - cron: '47 5 * * 1,2,4,5'    # 월·화·목·금 14:47 KST  따라잡기
    - cron: '47 10 * * 1,2,4,5'   # 월·화·목·금 19:47 KST  따라잡기
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        type: choice
        default: dry_run
        options:
          - dry_run   # 인스타 API 를 호출하지 않고 대상만 확인
          - verify    # 컨테이너까지 만들어 보고 발행은 하지 않음 (리허설)
          - publish   # 실제 게시
          - catchup   # publish 와 같되 빈 큐 경고를 내지 않음 (11:00 재시도용)
      id:
        description: 'verify 로 확인할 아이디어 id (비우면 오늘 배정된 건)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: ig-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 게시
        id: post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 크론으로 돌 때는 inputs 가 비어 있다 — 그때가 실제 발행이다.
          # 정시 크론만 publish, 나머지 크론은 전부 따라잡기다. 따라잡기는
          # 대기 건이 없는 게 정상이라 빈 큐 경고를 내지 않는다 — 그 구분이
          # 없으면 하루 세 번 거짓 경보가 울려 진짜 경고가 묻힌다.
          # 정시 하나만 지목하는 형태라 따라잡기를 늘려도 여기는 안 고쳐도 된다.
          MODE: ${{ inputs.mode || (github.event.schedule == '37 22 * * 0,1,3,4' && 'publish' || 'catchup') }}
          WANTED_ID: ${{ inputs.id }}
        run: |
          case "$MODE" in
            dry_run) python3 scripts/publish.py --dry-run ;;
            verify)  python3 scripts/publish.py --mode verify ${WANTED_ID:+--id "$WANTED_ID"} ;;
            publish) python3 scripts/publish.py ;;
            catchup) python3 scripts/publish.py --mode catchup ;;
            *)       echo "::error::알 수 없는 mode: $MODE"; exit 1 ;;
          esac

      # always() 로 두는 이유: 2026-08 에 취소된 실행이 인스타에는 실제로 올렸는데
      # 상태 파일 커밋을 못 해 큐가 어긋난 적이 있다 (0d6e845 → 79160f5).
      # 발행이 실패하거나 취소돼도 그때까지의 상태 변화는 반드시 남긴다.
      - name: 상태 파일 커밋
        if: always() && (inputs.mode == '' || inputs.mode == 'publish')
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pipeline/
          git diff --staged --quiet && exit 0
          git commit -m "chore: 인스타 파이프라인 상태 갱신 [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
