name: 인스타그램 자동 게시

# 월·금 = ClipNote / 화·목 = TakeASeat
# 실제로 무엇을 올릴지는 이 크론이 아니라 상태 파일의 scheduled_at 이 정한다.
#
# 크론을 두 번 건다. GitHub Actions 크론은 보장이 아니라 최선 노력이고,
# 정각(:00)은 전 세계가 몰려 가장 많이 밀리는 슬롯이다. 실제로 2026-08-27
# 08:00 KST 실행이 통째로 씹혀 takeaseat-1 이 안 나갔다. 실패가 아니라
# 아무 일도 안 일어나서 알림만 봐서는 정상으로 보였다.
#
# publish.py 는 published_at·media_id 로 멱등하므로 같은 날 두 번 돌아도
# 중복 발행되지 않는다. 첫 실행이 올렸으면 두 번째는 조용히 끝난다.
#
#   08:13 KST = 23:13 UTC 전날 (정시)   — 정각을 피해 13분 뒤로
#   11:00 KST = 02:00 UTC 당일 (따라잡기) — 정시가 씹혔으면 여기서 줍는다
on:
  schedule:
    - cron: '13 23 * * 0,1,3,4'   # 월·화·목·금 08:13 KST
    - cron: '0 2 * * 1,2,4,5'     # 월·화·목·금 11:00 KST
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        type: choice
        default: dry_run
        options:
          - dry_run   # 인스타 API 를 호출하지 않고 대상만 확인
          - verify    # 컨테이너까지 만들어 보고 발행은 하지 않음 (리허설)
          - publish   # 실제 게시
          - catchup   # publish 와 같되 빈 큐 경고를 내지 않음 (11:00 재시도용)
      id:
        description: 'verify 로 확인할 아이디어 id (비우면 오늘 배정된 건)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: ig-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 게시
        id: post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 크론으로 돌 때는 inputs 가 비어 있다 — 그때가 실제 발행이다.
          # 두 번째 크론(11:00 KST)은 따라잡기다. 대기 건이 없는 게 정상이라
          # 빈 큐 경고를 내지 않는다. 그 구분이 없으면 매일 거짓 경보가 울린다.
          MODE: ${{ inputs.mode || (github.event.schedule == '0 2 * * 1,2,4,5' && 'catchup' || 'publish') }}
          WANTED_ID: ${{ inputs.id }}
        run: |
          case "$MODE" in
            dry_run) python3 scripts/publish.py --dry-run ;;
            verify)  python3 scripts/publish.py --mode verify ${WANTED_ID:+--id "$WANTED_ID"} ;;
            publish) python3 scripts/publish.py ;;
            catchup) python3 scripts/publish.py --mode catchup ;;
            *)       echo "::error::알 수 없는 mode: $MODE"; exit 1 ;;
          esac

      # always() 로 두는 이유: 2026-08 에 취소된 실행이 인스타에는 실제로 올렸는데
      # 상태 파일 커밋을 못 해 큐가 어긋난 적이 있다 (0d6e845 → 79160f5).
      # 발행이 실패하거나 취소돼도 그때까지의 상태 변화는 반드시 남긴다.
      - name: 상태 파일 커밋
        if: always() && (inputs.mode == '' || inputs.mode == 'publish')
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pipeline/
          git diff --staged --quiet && exit 0
          git commit -m "chore: 인스타 파이프라인 상태 갱신 [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
