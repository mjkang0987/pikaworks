name: 인스타그램 자동 게시

# 월·화·목·금 08:00 KST = 23:00 UTC (일·월·수·목)
# 월·금 = ClipNote / 화·목 = TakeASeat
# GitHub Actions 크론은 혼잡 시 5~15분 지연될 수 있다.
on:
  schedule:
    - cron: '0 23 * * 0,1,3,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제 게시 없이 대상만 확인'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ig-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 게시
        id: post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          QUEUE = 'data/ig_post_queue.json'
          API   = 'https://graph.instagram.com/v21.0'
          TOKEN = os.environ.get('IG_ACCESS_TOKEN', '')
          DRY   = os.environ.get('DRY_RUN', 'false') == 'true'

          def out(k, v):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'{k}={v}\n')

          def summary(md):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(md + '\n')

          def mask(s):
              return s.replace(TOKEN, '[TOKEN]') if TOKEN else s

          def call(method, path, params):
              url = f'{API}/{path}'
              data = urllib.parse.urlencode(params).encode()
              req = urllib.request.Request(url + ('' if method == 'POST' else '?' + data.decode()),
                                           data=data if method == 'POST' else None, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  body = mask(e.read().decode('utf-8', 'replace'))
                  raise SystemExit(f'::error::Instagram API {e.code} — {body[:500]}')

          if not TOKEN:
              raise SystemExit('::error::secrets.IG_ACCESS_TOKEN 이 비어 있습니다. 레포 Settings > Secrets 에 등록하세요.')

          kst = datetime.now(timezone(timedelta(hours=9)))
          wd  = kst.weekday()                      # 월=0 … 일=6
          product = {0: 'clipnote', 4: 'clipnote', 1: 'takeaseat', 3: 'takeaseat'}.get(wd)
          summary(f'### 실행 {kst:%Y-%m-%d %H:%M} KST (요일 {wd})')

          if product is None:
              summary('게시 요일이 아닙니다. 종료.')
              out('result', 'skipped-weekday'); sys.exit(0)

          q = json.load(open(QUEUE, encoding='utf-8'))
          target = next((p for p in q['posts']
                         if p.get('product') == product and p.get('status') == 'ready'), None)

          if target is None:
              summary(f'오늘 대상: **{product}** — 게시할 콘텐츠 없음. 정상 종료.')
              out('result', 'no-content'); sys.exit(0)

          summary(f"오늘 대상: **{product}** / 항목 `{target['id']}`")
          if DRY:
              summary('dry_run 이므로 게시하지 않고 종료.')
              out('result', 'dry-run'); sys.exit(0)

          ig = str(q['instagram_user_id'])

          # 1) 컨테이너 생성
          c = call('POST', f'{ig}/media', {
              'image_url': target['image_url'],
              'caption': target['caption'],
              'access_token': TOKEN,
          })
          cid = c['id']

          # 2) FINISHED 대기 (최대 2분)
          for _ in range(24):
              s = call('GET', cid, {'fields': 'status_code', 'access_token': TOKEN})
              code = s.get('status_code')
              if code == 'FINISHED':
                  break
              if code in ('ERROR', 'EXPIRED'):
                  raise SystemExit(f'::error::컨테이너 상태 {code}')
              time.sleep(5)
          else:
              raise SystemExit('::error::컨테이너가 2분 안에 FINISHED 가 되지 않았습니다.')

          # 3) 발행
          pub  = call('POST', f'{ig}/media_publish', {'creation_id': cid, 'access_token': TOKEN})
          info = call('GET', pub['id'], {'fields': 'permalink', 'access_token': TOKEN})
          link = info.get('permalink', '')

          # 4) 큐 갱신
          target['status']    = 'posted'
          target['posted_at'] = kst.strftime('%Y-%m-%d')
          target['permalink'] = link
          with open(QUEUE, 'w', encoding='utf-8') as f:
              json.dump(q, f, ensure_ascii=False, indent=2)
              f.write('\n')

          ready = [p for p in q['posts'] if p.get('status') == 'ready']
          by = {}
          for p in ready:
              by[p['product']] = by.get(p['product'], 0) + 1
          left = ' / '.join(f'{k} {v}건' for k, v in sorted(by.items())) or '없음'

          summary(f'게시 완료 — {link}')
          summary(f'남은 ready: {left}')
          if len(ready) <= 1:
              summary('⚠️ 콘텐츠 소진 임박')

          out('result', 'posted')
          out('permalink', link)
          out('post_id', target['id'])
          PY

      - name: 큐 갱신 커밋
        if: steps.post.outputs.result == 'posted'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ig_post_queue.json
          git diff --staged --quiet || git commit -m "chore: ${{ steps.post.outputs.post_id }} 게시 완료 반영 [skip ci]"
          git push
