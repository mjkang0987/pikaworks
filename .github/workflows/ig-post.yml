name: 인스타그램 자동 게시

# 월·금 = ClipNote / 화·목 = TakeASeat
# 실제로 무엇을 올릴지는 이 크론이 아니라 상태 파일의 scheduled_at 이 정한다.
#
# ── 왜 06:00 에 깨워서 08:00 까지 재우는가 ────────────────────────────
#
# GitHub Actions 크론은 보장이 아니라 최선 노력이다. 관측된 지연: 13분,
# 20분, 39분, 47분, 106분, 그리고 한 번은 약 6시간. 08:00 에 크론을 걸면
# 실제 발행은 08:00~09:47 어딘가가 된다. 정해진 시각에 나가야 하는
# 마케팅 게시물에 이 편차는 못 쓴다.
#
# 이전 구조는 따라잡기 크론을 세 개(10:47·14:47·19:47) 더 걸어 하루를
# 넓게 덮었다. 이게 사고를 냈다 — 2026-08-27 의 19:47 실행이 약 6시간
# 밀려 KST 자정을 넘겨 돌았고, 넘어간 시점의 날짜로 "오늘 슬롯"을 계산해
# 다음 날 것을 01:49 에 올려버렸다. 늦게 나가는 것보다 나쁘다.
#
# 그래서 크론은 하나만 남기고, 지연을 크론이 아니라 잡 안에서 흡수한다.
#
#   1. 목표보다 이르게 깨운다 (04:00 과 06:00 KST)
#   2. 깨어난 시점의 KST 날짜를 목표 날짜로 못박는다
#   3. 그 날짜의 08:00 KST 까지 잡 안에서 잔다
#   4. --date 로 못박은 날짜를 넘겨 발행한다
#
# 2번이 자정 넘김 사고를 막는다. 발행 시점이 아니라 깨어난 시점으로
# 날짜를 정하므로, 대기 중에 날짜가 바뀌어도 올리는 건 원래 그날 것이다.
# 3번이 지연을 흡수한다. 지연은 대기 시간이 줄어들 뿐이라 발행은 그대로
# 08:00 이다. 대기 시간을 다 써버릴 만큼 밀리면 대기 없이 즉시 올린다.
#
# ── 왜 크론을 두 개 거는가 ────────────────────────────────────────────
#
# 위 구조는 크론이 밀리는 것은 흡수하지만 크론이 아예 안 도는 것은 못
# 막는다. 2026-08-27 에 실제로 그랬다 — 실패가 아니라 아무 일도 안 일어나서
# 알림만 봐서는 정상으로 보였다. 그래서 04:00 과 06:00 두 번 깨운다.
#
# 둘은 경쟁하지 않는다. 목표 시각(08:00)과 목표 날짜 계산이 같으므로
# 어느 쪽이 살아남든 같은 건을 같은 시각에 올린다. 먼저 깬 쪽이 자는 동안
# 뒤 크론은 concurrency 로 큐에 걸렸다가, 앞이 발행을 마치면 돌아서
# published_at 을 보고 조용히 끝난다 (publish.py 멱등).
#
# 이전 구조의 따라잡기 크론과는 다르다. 그건 서로 다른 시각을 목표로 삼아
# 늦게 도는 쪽이 늦은 시각에 올렸다. 여기서는 목표가 하나뿐이다.
#
# 리포가 public 이라 대기 중 Actions 분은 과금되지 않는다.
on:
  schedule:
    - cron: '0 19 * * 0,1,3,4'   # 04:00 KST 월·화·목·금 (UTC 로는 전날)
    - cron: '0 21 * * 0,1,3,4'   # 06:00 KST 월·화·목·금 (UTC 로는 전날)

  # 즉시 발행용 수동 스위치.
  #
  # workflow_dispatch 는 Actions 화면에서 눌러야 하고, 자동화 계정·통합에서는
  # 권한이 없어 403 이 난다 (2026-08-27 실제로 막혔다). 반면 main 에 푸시하는
  # 경로는 열려 있는 경우가 많다. 그래서 파일 하나를 스위치로 둔다.
  #
  #   date > .github/publish-now && git commit && main 에 머지
  #
  # 이 경로는 대기하지 않고 즉시 돈다 — 지금 올리려고 누른 것이므로.
  # MODE 는 catchup 으로 떨어져 대기 건이 없으면 조용히 끝난다.
  # publish.py 가 published_at·media_id 로 멱등하므로 크론과 겹쳐 돌아도
  # 중복 발행되지 않는다.
  #
  # paths 를 이 파일 하나로 좁힌 이유: 범위를 넓히면 평범한 콘텐츠 푸시마다
  # 발행기가 돈다. 상태 파일 커밋은 [skip ci] 가 붙어 있어 되돌아오지 않는다.
  push:
    paths:
      - '.github/publish-now'

  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        type: choice
        default: dry_run
        options:
          - dry_run   # 인스타 API 를 호출하지 않고 대상만 확인
          - verify    # 컨테이너까지 만들어 보고 발행은 하지 않음 (리허설)
          - publish   # 실제 게시
          - catchup   # publish 와 같되 빈 큐 경고를 내지 않음
      id:
        description: 'verify 로 확인할 아이디어 id (비우면 오늘 배정된 건)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: ig-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # 최대 대기 5시간 + 발행 여유. 잡 기본 한도(6시간)보다 아래다.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # 크론으로 깨어났을 때만 잔다. 수동 스위치·workflow_dispatch 는
      # 지금 올리려고 누른 것이므로 그대로 통과시킨다.
      - name: 발행 시각(08:00 KST)까지 대기
        if: github.event_name == 'schedule'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import os, sys, time
          from datetime import datetime, timedelta, timezone

          KST = timezone(timedelta(hours=9))
          # 가장 이른 크론이 04:00 이므로 정상 대기는 최대 4시간이다.
          # 5시간을 넘는다는 건 03:00 이전에 깨어났다는 뜻이고, 그건 크론이
          # 하루 가까이 밀려 엉뚱한 날 새벽에 돌았다는 뜻이다.
          MAX_WAIT_H = 5

          now = datetime.now(KST)
          # 깨어난 시점의 날짜로 목표를 못박는다. 대기 중 자정을 넘겨도
          # 올리는 건 원래 그날 것이어야 한다 (2026-08-27 01:49 오발행).
          target = now.replace(hour=8, minute=0, second=0, microsecond=0)
          wait = (target - now).total_seconds()

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'TARGET_DATE={target:%Y-%m-%d}\n')

          def note(msg):
              print(msg)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(msg + '\n\n')

          def warn(msg):
              # 발행기의 알림 경로를 그대로 쓴다 — 요약과 Slack 양쪽에 남는다.
              # 아무 일도 안 일어나서 정상처럼 보이는 실패가 이 파이프라인의
              # 고질병이었다 (2026-08-27 takeaseat-1).
              sys.path.insert(0, 'scripts')
              import publish
              publish.notify(msg, 'warn')

          if wait <= 0:
              note(f'발행 시각(08:00)을 {-wait / 60:.0f}분 넘긴 '
                   f'{now:%H:%M} KST 에 깨어났습니다. 대기 없이 즉시 발행합니다.')
          elif wait > MAX_WAIT_H * 3600:
              # 그 상태로 기다렸다 올리면 그날 정상 크론과 겹칠 뿐이므로 넘긴다.
              # 대신 조용히 끝내지 않는다 — 아무 일도 안 일어나서 정상처럼
              # 보이는 실패가 이 파이프라인의 고질병이었다.
              warn(f'{now:%Y-%m-%d %H:%M} KST 에 깨어났습니다 — 08:00 까지 '
                   f'{wait / 3600:.1f}시간. 크론이 비정상적으로 밀렸다는 뜻이라 '
                   f'이번 실행은 발행하지 않고 넘깁니다. GitHub Actions 크론 '
                   f'상태를 확인해 주세요.')
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('SKIP_PUBLISH=1\n')
          else:
              note(f'{now:%H:%M} KST 에 깨어났습니다. '
                   f'{target:%Y-%m-%d} 08:00 KST 까지 {wait / 60:.0f}분 대기합니다.')
              time.sleep(wait)
          PY

      - name: 게시
        id: post
        if: env.SKIP_PUBLISH != '1'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 크론 = 정시 발행. 수동 스위치(push) = 따라잡기 — 지금 올리려고
          # 누른 것이라 대기 건이 없어도 경고하지 않는다.
          MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'publish' || 'catchup') }}
          WANTED_ID: ${{ inputs.id }}
        run: |
          # TARGET_DATE 는 대기 단계에서 못박은 날짜다. 크론이 아닐 때는
          # 비어 있고, 그때는 publish.py 가 현재 KST 날짜를 쓴다.
          DATE_ARG=${TARGET_DATE:+--date $TARGET_DATE}
          case "$MODE" in
            dry_run) python3 scripts/publish.py --dry-run $DATE_ARG ;;
            verify)  python3 scripts/publish.py --mode verify ${WANTED_ID:+--id "$WANTED_ID"} ;;
            publish) python3 scripts/publish.py $DATE_ARG ;;
            catchup) python3 scripts/publish.py --mode catchup $DATE_ARG ;;
            *)       echo "::error::알 수 없는 mode: $MODE"; exit 1 ;;
          esac

      # always() 로 두는 이유: 2026-08 에 취소된 실행이 인스타에는 실제로 올렸는데
      # 상태 파일 커밋을 못 해 큐가 어긋난 적이 있다 (0d6e845 → 79160f5).
      # 발행이 실패하거나 취소돼도 그때까지의 상태 변화는 반드시 남긴다.
      - name: 상태 파일 커밋
        if: always() && (inputs.mode == '' || inputs.mode == 'publish')
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pipeline/
          git diff --staged --quiet && exit 0
          git commit -m "chore: 인스타 파이프라인 상태 갱신 [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
