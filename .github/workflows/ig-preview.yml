name: 인스타그램 발행 프리뷰

# 발행 전날 20:00 KST = 11:00 UTC. 발행일이 월·화·목·금이므로
# 전날은 일·월·수·목이다. 내일 무엇이 올라가는지 알리고,
# 슬롯인데 대기 건이 없으면 경고한다. 마지막 안전장치다.
on:
  schedule:
    - cron: '0 11 * * 0,1,3,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 프리뷰 알림
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/publish.py --mode preview --dry-run
